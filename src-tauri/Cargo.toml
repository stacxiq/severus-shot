[package]
name = "severus-shot"
version = "0.7.0"
description = "Desktop App Store / Google Play screenshot maker with agent (MCP) control"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
zip = { version = "2", default-features = false }
fontdb = "0.23"
tiny_http = "0.12"
ureq = { version = "2", default-features = false, features = ["tls", "native-certs"] }

# Keep image encoding fast in development builds too.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
